name: Build PSP Space Invaders

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build with Make
        run: |
          # Önce standart make çalıştır, ardından EBOOT.PBP hedefini tetikle
          make || true
          make EBOOT.PBP || true
          
          # Eğer hâlâ EBOOT.PBP oluşmadıysa pspdev komutlarıyla manuel paketle
          if [ ! -f "EBOOT.PBP" ]; then
            echo "Makefile target missing, packaging manually..."
            psp-gcc -O2 -G0 -Wall main.c -I$(psp-config --pspsdk-path)/include -L$(psp-config --pspsdk-path)/lib -o space_invaders.elf -lpspuser -lpspkernel
            psp-fixup-imports space_invaders.elf
            psp-strip space_invaders.elf -o space_invaders_strip.elf
            prxgen space_invaders_strip.elf space_invaders.prx
            mksfoex -d "Space Invaders PSP" PARAM.SFO
            pack-pbp EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL NULL space_invaders.prx
          fi
          
          ls -la EBOOT.PBP

      - name: Upload PSP PBP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: space_invaders_pbp
          path: EBOOT.PBP
          if-no-files-found: error
